services:
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    ports:
      - " 8000:8000\
 environment:
 - PORT=8000
 restart: unless-stopped

 app:
 build:
 context: .
 dockerfile: backend/Dockerfile
 ports:
 - \5000:5000\
 environment:
 - PORT=5000
 - AI_SERVICE_URL=http://ai_service:8000
 depends_on:
 - ai_service
 restart: unless-stopped
